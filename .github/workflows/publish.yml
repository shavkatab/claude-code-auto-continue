name: Publish

# Runs when a GitHub release is published: builds the .vsix and attaches it to the release.
# If the repository secret OVSX_PAT (open-vsx.org token) is set, also publishes to Open VSX.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - name: Package
        run: |
          npx -y @vscode/vsce@3 package --no-dependencies -o extension.vsix
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: |
          npx -y ovsx@0 create-namespace shavkatab || echo "namespace already exists"
          npx -y ovsx@0 publish extension.vsix
      - name: Attach to the release
        if: github.event_name == 'release'
        run: |
          cp extension.vsix "claude-code-auto-continue-${VERSION}.vsix"
          gh release upload "${{ github.event.release.tag_name }}" "claude-code-auto-continue-${VERSION}.vsix" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
